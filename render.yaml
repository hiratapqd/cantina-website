services:
  - type: web
    name: casinha-azul-demo
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run demo
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: demo
      - key: HOST
        value: 0.0.0.0
      - key: APP_SECRET
        generateValue: true
