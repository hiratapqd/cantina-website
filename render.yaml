services:
  - type: web
    name: casinha-azul
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: APP_SECRET
        generateValue: true
